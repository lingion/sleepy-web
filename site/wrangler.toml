# Portable static-asset Worker configuration.
# Copy this file, set your own Worker name and optional custom domain.
# 手动重部署: BASE_PATH=/ npx tsc -b && BASE_PATH=/ npx vite build
#         cd site && CLOUDFLARE_API_TOKEN=$(cat ~/.cloudflare-token) npx --prefix ~/proxy wrangler deploy
#   (token 位置: ~/.cloudflare-token; wrangler 复用 ~/proxy/node_modules)
# Docs: assets.directory + not_found_handling="single-page-application"
#   → 未匹配路由回 200 + index.html (developers.cloudflare.com/workers/static-assets/)
#   纯静态资产 worker 无需 main 脚本
#   custom_domain=true 免 DNS/证书手配 (developers.cloudflare.com/workers/wrangler/configuration/#routes)
# hash 路由不经服务端 (# 后片段不随请求上行), Pages/Worker 双部署均成立
name = "sleepy-web-site"
compatibility_date = "2026-09-01"

# Add your own custom domain route here after creating the Worker.
# routes = [
#   { pattern = "schedule.example.com", custom_domain = true },
# ]

[assets]
# 相对 wrangler.toml 所在目录 → 仓库根 dist (本地构建与 CI 构建同一产物;
# 曾用 site/dist symlink, CI checkout 不跟踪 symlink 之外的状态, 改相对路径更稳)
directory = "../dist"
not_found_handling = "single-page-application"

[observability]
enabled = true
