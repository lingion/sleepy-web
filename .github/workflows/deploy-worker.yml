# Sleepy Web — portable Cloudflare Worker deployment
# Copy public/schedule.sleepy into this repository before deploying.
# token: gh secret set CLOUDFLARE_API_TOKEN (加密 secrets, 不回显不入库)
# 重部署(手动): BASE_PATH=/ npx tsc -b && BASE_PATH=/ npx vite build
#               cd site && CLOUDFLARE_API_TOKEN=<token> npx --prefix ~/proxy wrangler deploy
name: Deploy to Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 可选: 用 CI Secret 注入课表 (base64), 免提交私有文件到仓库
      - name: Inject schedule from secret (optional)
        env:
          SCHEDULE_B64: ${{ secrets.PUBLIC_SCHEDULE_B64 }}
        run: |
          if [ -n "$SCHEDULE_B64" ]; then
            echo "$SCHEDULE_B64" | base64 -d > public/schedule.sleepy
            echo "Injected public/schedule.sleepy from PUBLIC_SCHEDULE_B64 secret."
          fi

      # 有私人课表时构建只读 public 版本；没有课表时仍部署普通 Web 版本，
      # 避免前端修复因缺少私人数据而无法上线。
      - name: Detect public schedule
        id: schedule
        run: |
          if [ -f public/schedule.sleepy ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::public/schedule.sleepy absent — deploying the regular Web build without embedded schedule data."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public schedule
        if: steps.schedule.outputs.present == 'true'
        run: npm run build:public
        env:
          BASE_PATH: /
          VITE_PUBLIC_ACCESS_KEY_HASH: ${{ secrets.VITE_PUBLIC_ACCESS_KEY_HASH }}

      - name: Build regular Web app
        if: steps.schedule.outputs.present != 'true'
        run: npm run build
        env:
          BASE_PATH: /

      - name: Deploy to Cloudflare Worker
        run: npx wrangler deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
