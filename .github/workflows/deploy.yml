# Sleepy Web — GitHub Pages 部署
# push 到 main 时构建并部署到 gh-pages → https://lingion.github.io/sleepy/
# ⚠ 首次推送需用户批准 (memory: 回复/推送须明示指令); 本文件为管线代码交付

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build
        env:
          # GitHub Pages 子路径 (vite.config.ts base=/sleepy/ 同源)
          BASE_PATH: /sleepy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
